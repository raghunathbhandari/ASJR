name: ASJR Trading Chart Lab — GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "TradingChartLab/**"
      - ".github/workflows/asjr_trading_chart_lab_pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "asjr-chart-lab-pages"
  cancel-in-progress: false
jobs:
  deploy:
    name: Publish static trading research chart
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload TradingChartLab static files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: TradingChartLab
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
