name: DDB 15m Alert Regression (temporary)

on:
  push:
    branches:
      - fix/ddb-15m-discord-volume-gann-20261123

permissions:
  contents: read

jobs:
  offline-ddb-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies (no broker connection)
        run: python -m pip install --disable-pip-version-check pandas==2.2.3
      - name: Compile updated Python files
        run: python -m py_compile RudraScanner/ddb_ema_gann_5m.py ASJR_Analyst/Tests/test_asjr_pipeline.py RudraScanner/tests/test_ddb_ema_gann_5m.py
      - name: Run DDB 15m no-volume no-Gann Discord regression tests
        run: python -m unittest RudraScanner.tests.test_ddb_ema_gann_5m -v
