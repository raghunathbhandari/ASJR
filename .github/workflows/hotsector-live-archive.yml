name: HotSector live archive tests
on:
  push:
    paths:
      - 'Rudra-HotSectorHotStock/live_scan_collector.py'
      - 'Rudra-HotSectorHotStock/test_live_scan_collector.py'
      - 'ASJR_Analyst/Tests/test_asjr_pipeline.py'
      - '.github/workflows/hotsector-live-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile Rudra-HotSectorHotStock/live_scan_collector.py ASJR_Analyst/Tests/test_asjr_pipeline.py
      - run: python -m unittest discover -s Rudra-HotSectorHotStock -p test_live_scan_collector.py -v
