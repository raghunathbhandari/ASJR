name: Rudra DDB 46 Three-Month Screen

on:
  push:
    paths:
      - '.github/workflows/rudra_ddb_46.yml'
      - 'RudraScanner/ResearchBridge/ddb_46.trigger'

permissions:
  contents: write

concurrency:
  group: rudra-ddb-46
  cancel-in-progress: false

jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local analytical dependencies
        run: python -m pip install --quiet pandas numpy
      - name: Screen all 46 using committed daily Yahoo candles
        run: python -m RudraScanner.research_ddb_46
      - name: Commit only two research result files
        run: |
          git config user.name "ASJR Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add RudraScanner/ResearchData/EMA50_2026-10-15/DDB_3MONTH_MULTI_SWING_46.csv RudraScanner/ResearchData/EMA50_2026-10-15/DDB_3MONTH_MULTI_SWING_46.md
          if ! git diff --cached --quiet; then
            git commit -m "Research: completed DDB 46 three-month multi-swing screen"
            git push
          fi
